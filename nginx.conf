# ToolXr — Nginx Production Config
# ─────────────────────────────────────────────────────────────────
# SETUP:
#   sudo cp nginx.conf /etc/nginx/sites-available/toolxr
#   sudo ln -s /etc/nginx/sites-available/toolxr /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# HTTPS (free SSL):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# ─────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Replace with your actual project path
    root /var/www/toolxr;
    index toolxr.html;

    # ── Frontend ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /toolxr.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
    }

    # ── Backend API — proxy to Node.js on port 3001 ───────────────
    location /api/ {
        proxy_pass          http://127.0.0.1:3001;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection 'upgrade';
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass  $http_upgrade;

        # Allow large file uploads (50MB)
        client_max_body_size  50M;

        # Timeouts for long-running conversions
        proxy_read_timeout    120s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    120s;
    }

    # ── Cache static assets ───────────────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Block hidden files (.env, .git, etc.) ─────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Gzip compression ──────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/html
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1000;
}

# ── Certbot will auto-add the HTTPS (port 443) block below ────────
# after running: certbot --nginx -d yourdomain.com
